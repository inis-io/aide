version: 1
contract: licenhub.apis.v1
defaults:
  transport_fallback: false
  envelope: raw_json_bytes
  auth: activation-sign-v1
  idempotent_key: x-request-id
# API 商城运行面协议矩阵（强制维护，任一协议适配或一致性测试缺失不算完成，见 licen-hub
# docs/plan/apis/04-HTTP与gRPC双协议设计.md §4）。列序固定 12 列，即 proto/licence/v1 矩阵的
# 11 列基础上追加第 12 列 HTTP 路由落地状态（幂等列同时新增 read-only 取值）；
# 由同目录 protocol_matrix_test.go 逐行校验：
#   0 SDK 方法（阶段 4 typed 方法，见 licen-hub docs/plan/apis/06-SDK设计.md）
#   1 HTTP 方法  2 HTTP 路径
#   3 gRPC full method（真名，本列书写不含前导 /，如 licenhub.apis.v1.ApisRuntimeService/Invoke；
#     生成代码的 FullMethodName 常量本身含前导 /，二者仅差首字符，拼签名 canonical 照抄常量）
#   4 认证（activation-sign-v1 = 许可证凭证 + Ed25519 请求签名：HTTP X-License-* 头族 /
#     gRPC metadata x-license-*，canonical 见 04 §2.2）
#   5 权限码（运行面身份由许可证凭证推导，不进 IAM 权限码体系，留空）
#   6 数据域  7 操作（read / write）  8 风险（normal / high / critical）
#   9 幂等（true / false / read-only）
#   10 关键业务码（空格分隔，是各 rpc 最需要客户侧处置的关键码而非全集——完整 17 码集合见
#      runtime.proto 服务注释，逐码 → gRPC status 映射表见 licen-hub 04 §2.4；
#      业务码逐字挂在 status 的 errdetails.ErrorInfo.Reason，与 HTTP 运行面失败信封 code 同源）
#   11 HTTP 路由落地状态（landed 已落地 / pending 待落地）
#
# 凭证族与幂等键不进消息：token/时间戳/nonce/签名走 metadata x-license-*，
# 调用级幂等键走 metadata x-request-id（等价 HTTP X-Request-Id）。
# 本矩阵为唯一映射清单；SDK 侧 typed 方法与 runtime 包 gRPC 传输绑定已随阶段 4 T19 落地
# （licence/apis 三方法 + runtime-transport-grpc.go 三 case，绑定门禁见 protocol_matrix_test.go）。
runtime:
  # NOT_FOUND 是认证失败的唯一外显码（模糊 404，防爆破），三个 rpc 皆可达；UNAUTHORIZED/FORBIDDEN
  # 来自用户状态闸门（gateUserStatus，全 rpc 生效）；ACCOUNT_FROZEN 等资金码对含按量定价的能力都适用。
  - [Client.Apis.Invoke, POST, /api/v1/apis/invoke, licenhub.apis.v1.ApisRuntimeService/Invoke, activation-sign-v1, "", apis, write, normal, true, "CAPABILITY_NOT_FOUND NOT_FOUND UNAUTHORIZED FORBIDDEN INVALID_ARGUMENT NO_ENTITLEMENT QUOTA_EXCEEDED INSUFFICIENT_BALANCE SPEND_LIMIT_EXCEEDED ACCOUNT_FROZEN CONCURRENCY_LIMITED RATE_LIMITED UPSTREAM_ERROR INTERNAL_ERROR", landed]
  - [Client.Apis.IPLocate, POST, /api/v1/apis/ip-locate/query, licenhub.apis.v1.ApisRuntimeService/IPLocate, activation-sign-v1, "", apis, write, normal, true, "IP_NOT_FOUND NOT_FOUND UNAUTHORIZED FORBIDDEN INVALID_ARGUMENT NO_ENTITLEMENT QUOTA_EXCEEDED INSUFFICIENT_BALANCE SPEND_LIMIT_EXCEEDED ACCOUNT_FROZEN CONCURRENCY_LIMITED RATE_LIMITED UPSTREAM_ERROR INTERNAL_ERROR", landed]
  # Usage 的 HTTP 路由（GET /api/v1/apis/usage）与 gRPC 服务端已随 T18 落地（licen-hub
  # app/api/control/apis-runtime.go 的 Get: {Key: "usage"} + grpc/apis/v1 的 ApisRuntimeService.Usage）。
  # 服务端只读（幂等列 read-only）：不占闸门、不计量不收费，归属强制由凭证推导，客户端不可指定。
  - [Client.Apis.Usage, GET, /api/v1/apis/usage, licenhub.apis.v1.ApisRuntimeService/Usage, activation-sign-v1, "", apis, read, normal, read-only, "UNAUTHORIZED NOT_FOUND INVALID_ARGUMENT INTERNAL_ERROR", landed]
  # MailSend（阶段 5 T23）：能力/动作由服务端固定（mail-send/send），计量数 = 去重后收件人数（每封计 1，
  # 单次上限 20）；正文原样投递（不做模板替换、不自动追加验证码），全部收件人投递成功才算交付，
  # 任一失败即 UPSTREAM_ERROR（预扣全额释放、不收费）。INVALID_ARGUMENT 覆盖非法收件人/超长主题正文。
  - [Client.Apis.MailSend, POST, /api/v1/apis/mail-send/send, licenhub.apis.v1.ApisRuntimeService/MailSend, activation-sign-v1, "", apis, write, normal, true, "INVALID_ARGUMENT NOT_FOUND UNAUTHORIZED FORBIDDEN NO_ENTITLEMENT QUOTA_EXCEEDED INSUFFICIENT_BALANCE SPEND_LIMIT_EXCEEDED ACCOUNT_FROZEN CONCURRENCY_LIMITED RATE_LIMITED UPSTREAM_ERROR INTERNAL_ERROR", pending]
