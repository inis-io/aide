syntax = "proto3";

package licenhub.licence.v1;

option go_package = "github.com/inis-io/aide/licence/proto/licence/v1;licencev1";

// AdminRequest 保留现有管理面强类型 SDK DTO 的 JSON 编码。
// RPC 本身按业务动作显式建模，不允许携带 HTTP method/path。
message AdminRequest {
  bytes json = 1;
}

// AdminResponse 对齐管理面 {code,msg,data} 信封；data_json 是 data 的原始 JSON。
message AdminResponse {
  int32 code = 1;
  string message = 2;
  bytes data_json = 3;
}

// AdminFileChunk 用于发布物上传和带文件验签。首帧携带 json/file_name，后续帧只携带 chunk。
message AdminFileChunk {
  bytes json = 1;
  string file_name = 2;
  bytes chunk = 3;
}

service AdminAuthService {
  rpc SignIn(AdminRequest) returns (AdminResponse);
  rpc SignOut(AdminRequest) returns (AdminResponse);
  rpc CheckToken(AdminRequest) returns (AdminResponse);
}

