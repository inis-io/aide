syntax = "proto3";

package licenhub.licence.v1;

option go_package = "github.com/inis-io/aide/licence/proto/licence/v1;licencev1";

// LicenseRuntimeService - 许可证实例运行面。
service LicenseRuntimeService {
  rpc Activate(ActivateRequest) returns (RuntimeResponse);
  rpc Validate(ValidateRequest) returns (RuntimeResponse);
  rpc Current(CurrentLicenseRequest) returns (RuntimeResponse);
  // ProvisionByPlan - 装机自动申领（sdk_auto 匿名 Public；project_no + install_sn 定位，
  // 平台按项目 issue_mode=sdk_auto 配置的 auto_issue_plan_id 套餐档位签发，不使用项目级令牌）。
  // 强制指纹项目首次返回 FINGERPRINT_REQUIRED + salt，客户端计算指纹后复用 install_sn 重试一次。
  // activation_code = 激活码入座（占用客户既有许可证的一个席位、不签发新证）；
  // migration_code 仅用于识别旧客户端并返回 MIGRATION_REMOVED，不再提供迁移成功路径。
  rpc ProvisionByPlan(ProvisionRequest) returns (ProvisionResponse);
  // CustomerBind - 客户账号绑定（门户授权确认页签发的一次性票据；activation-sign-v1 实例签名防重放）。
  // 绑定成功后许可证归属客户账号，不改变席位或套餐。
  rpc CustomerBind(CustomerBindRequest) returns (CustomerBindResponse);
  // CustomerBindPrepare - 已激活实例预注册一次性授权请求（固定许可证、回跳地址与 state）。
  rpc CustomerBindPrepare(CustomerBindPrepareRequest) returns (CustomerBindPrepareResponse);
}

// UpdateRuntimeService - 在线更新运行面。
service UpdateRuntimeService {
  rpc Check(UpdateCheckRequest) returns (UpdateCheckResponse);
  rpc Report(UpdateReportRequest) returns (UpdateReportResponse);
  rpc AppendLogs(UpdateLogsRequest) returns (UpdateReportResponse);
}

// SaasRuntimeService - SaaS 租户运行面。
service SaasRuntimeService {
  rpc Sync(TenantSyncRequest) returns (TenantSyncResponse);
  rpc Search(TenantSearchRequest) returns (TenantSearchResponse);
  rpc Validate(TenantValidateRequest) returns (TenantResponse);
  rpc Current(TenantCurrentRequest) returns (TenantResponse);
}

// ProjectConfigRuntimeService - 项目配置运行面。
// 已于配置系统合并时下线（项目配置并入平台配置）；服务整体移除，消息字段号以 reserved 锁定。
// service ProjectConfigRuntimeService { ... }

// PlatformConfigRuntimeService - 平台配置运行面。
service PlatformConfigRuntimeService {
  rpc Sync(PlatformConfigSyncRequest) returns (PlatformConfigSyncResponse);
  // ReportConfigConsumption - 运行面配置消费上报（SDK 读 key 后批量异步上报，gate 验签防重放）。
  rpc ReportConfigConsumption(ConfigConsumptionReportRequest) returns (ConfigConsumptionReportResponse);
}

// EventRuntimeService - 运行面事件订阅（项目级 callback_events 长轮询 / 服务端流）。
service EventRuntimeService {
  rpc Subscribe(EventSubscribeRequest) returns (stream EventMessage);
}

// ConfigPushbackRuntimeService - 配置回推运行面（客户端 → 平台，与平台配置下发方向相反）。
service ConfigPushbackRuntimeService {
  // Push - 运行面配置回推（客户端权威全量快照，平台 diff 落库 + 只追加审计）。
  rpc Push(ConfigPushbackPushRequest) returns (ConfigPushbackPushResponse);
  // PushDefinitions - 运行面配置定义反推（仅项目级；客户端权威全量定义快照，
  // 平台先做项目开关闸门（未开启 → PermissionDenied）与定义结构校验（失败 → InvalidArgument），
  // 通过后按分组/配置项分别 diff 落库 + 只追加审计）。
  rpc PushDefinitions(ConfigPushbackDefinitionsRequest) returns (ConfigPushbackDefinitionsResponse);
}

message ActivateRequest {
  string license_no = 1;
  string instance_no = 2;
  string fingerprint_hash = 3;
  string client_public_key = 4;
  int64 client_time = 5;
  string device_name = 6;
}

message ValidateRequest {
  string license_no = 1;
  string fingerprint_hash = 2;
  string version = 3;
  string feature = 4;
  map<string, int64> usage = 5;
  int64 client_time = 6;
}

message CurrentLicenseRequest {
  string license_no = 1;
}

// ProvisionRequest - 装机自动申领请求。
// sdk_auto 仅以 project_no + install_sn 定位项目与安装，不再使用项目级签发令牌。
// 历史字段 template_code 与 provision_token 的字段号、字段名永久 reserved。
message ProvisionRequest {
  reserved 1, 2;
  reserved "template_code", "provision_token";
  // project_no - 项目编号（必填，官方二进制内写死）
  string project_no = 7;
  // tenant_id - 0 = 普通装机申领；>0 = SaaS 子租户发证（平台按项目 tenant_issue_plan_id 档位签发）
  int64 tenant_id = 8;
  // install_sn - 安装唯一标识（必填，同项目下唯一）
  string install_sn = 3;
  // fingerprint_hash - 机器指纹哈希（可选，项目开启 provision_enforce_fingerprint 时强制）
  string fingerprint_hash = 4;
  // device_name - 机器名称（可选，缺省取 os.Hostname）
  string device_name = 5;
  // client_time - 客户端当前时间（毫秒，可选）
  int64 client_time = 6;
  // migration_code - 已下线的迁移码字段，仅为拒绝旧客户端保留；平台返回 MIGRATION_REMOVED，绝不消费或建证。
  string migration_code = 9 [deprecated = true];
  // activation_code - 一次性激活码（可选；携带时入座客户既有许可证的一个席位，不签发新证、不消耗 sdk_auto 配额）
  string activation_code = 10;
  // current_license_no - 当前许可证编号（可选；已激活实例换证入座时上送，携带时请求必须
  // 带 activation-sign-v1 实例签名，平台据此做冲突评估与旧席位释放）
  string current_license_no = 11;
  // release_old_seat - 换证入座成功后是否同事务释放当前许可证上的旧席位（仅随 current_license_no 生效）
  bool release_old_seat = 12;
  // confirm_replace - 冲突确认（仅随 current_license_no 生效）：当前证已持付费套餐时，
  // 缺省返回 ACTIVATION_CONFLICT 对比载荷且不消费激活码；显式 true 才执行换证
  bool confirm_replace = 13;
}

// RedeemRequest（商业激活码兑换请求）已随「激活码体系整体下线」删除：激活码兑换不再存在。
// proto3 不支持文件级消息名 reserved，故在此以注释锁定历史占用——消息名 RedeemRequest 与
// 字段号 code=1 / install_sn=2 / fingerprint_hash=3 / device_name=4 / client_time=5
// 均禁止被任何新消息复用；同一 RPC 语义禁止以「兑换」形态重新引入。

// ProvisionResponse - 装机自动申领统一响应。
message ProvisionResponse {
  string status = 1;
  int64 server_time = 2;
  string license_no = 3;
  string salt = 4;
  string binding_policy = 5;
  int32 seat_limit = 6;
  int64 expires_at = 7;
  bool reissued = 8;
  string message = 9;
  // keyset_json - bootstrap 根签名的项目工作公钥集合原文。
  bytes keyset_json = 10;
  // customer - 客户账号视图（仅许可证已绑定客户账号时下发，未绑定为 null）
  ProvisionCustomerView customer = 11;
  // conflict - 激活码换证冲突对比载荷（仅 status=ACTIVATION_CONFLICT 时下发，此时不消费激活码）
  ProvisionConflictView conflict = 12;
}

// ProvisionCustomerView - 许可证已绑定的客户账号视图（仅展示脱敏信息）。
message ProvisionCustomerView {
  // mask_account - 脱敏账号（如 r***@x.com）
  string mask_account = 1;
  // bound_at - 绑定时间（毫秒）
  int64 bound_at = 2;
}

// ProvisionConflictPlan - 换证冲突对比中的单证套餐视图。
message ProvisionConflictPlan {
  string license_no = 1;     // 许可证编号
  string plan_code = 2;      // 套餐编码
  string plan_name = 3;      // 套餐名称
  string billing = 4;        // 计费周期（monthly/yearly/buyout，免费证为空）
  string valid_until = 5;    // 到期时间（RFC3339，免费证为空）
  bool paid = 6;             // 是否付费套餐
}

// ProvisionConflictView - 激活码换证冲突对比载荷（status=ACTIVATION_CONFLICT 时随响应下发）。
message ProvisionConflictView {
  ProvisionConflictPlan current_plan = 1;  // 当前许可证套餐
  ProvisionConflictPlan target_plan = 2;   // 激活码目标许可证套餐
  int32 seat_used = 3;                     // 目标证已用席位数
  int32 seat_limit = 4;                    // 目标证席位上限
}

// CustomerBindRequest - 客户账号绑定请求。
message CustomerBindRequest {
  // code - 门户授权确认页签发的一次性授权票据
  string code = 1;
}

// CustomerBindResponse - 客户账号绑定响应。
message CustomerBindResponse {
  string status = 1;
  string message = 2;
  // customer - 绑定成功后的客户账号视图
  ProvisionCustomerView customer = 3;
}

// CustomerBindPrepareRequest - 一次性授权预注册上下文。
message CustomerBindPrepareRequest {
  string redirect_uri = 1;
  string state = 2;
}

// CustomerBindPrepareResponse - 预注册授权请求结果。
message CustomerBindPrepareResponse {
  string status = 1;
  string message = 2;
  string request_no = 3;
  int64 expires_at = 4;
  int64 server_time = 5;
  ProvisionCustomerView customer = 6;  // 已绑定证的脱敏归属（status=CUSTOMER_BOUND 时返回）
}

// RuntimeResponse - 许可证运行面统一响应。
// envelope_json 与 keyset_json 必须保留平台 JSON 原文，客户端分别基于 payload 原文验签。
message RuntimeResponse {
  string status = 1;
  int64 server_time = 2;
  bytes envelope_json = 3;
  string activation_no = 4;
  string activation_token = 5;
  int64 expires_at = 6;
  string message = 7;
  string seat_no = 8;
  bytes keyset_json = 9;
}

message UpdateCheckRequest {
  string license_no = 1;
  string fingerprint_hash = 2;
  string os_arch = 3;
  string version = 4;
  int64 client_time = 5;
}

message UpdateCheckResponse {
  string status = 1;
  int64 server_time = 2;
  bool update = 3;
  bytes manifest_json = 4;
  string message = 5;
  bytes keyset_json = 6;
}

message UpdateReportRequest {
  string license_no = 1;
  string record_no = 2;
  string from_version = 3;
  string target_version = 4;
  string artifact_no = 5;
  string status = 6;
  string message = 7;
  int64 client_time = 8;
}

message UpdateLogsRequest {
  string license_no = 1;
  string record_no = 2;
  repeated string lines = 3;
}

message UpdateReportResponse {
  string status = 1;
  int64 server_time = 2;
  string record_no = 3;
  string message = 4;
}

message TenantSyncRequest {
  string license_no = 1;
  int64 since_time = 2;
}

message TenantManifest {
  int32 version = 1;
  bytes menus_json = 2;
}

message TenantSyncItem {
  string tenant_code = 1;
  string status = 2;
  bytes envelope_json = 3;
}

message TenantSyncResponse {
  reserved 4;
  reserved "manifest";
  string status = 1;
  int64 server_time = 2;
  int64 sync_time = 3;
  repeated TenantSyncItem tenants = 5;
  string message = 6;
  TenantManifest platform_manifest = 7;
  TenantManifest tenant_manifest = 8;
}

message TenantSearchRequest {
  string license_no = 1;
  string prefix = 2;
}

message TenantSearchItem {
  string tenant_code = 1;
  string tenant_name = 2;
}

message TenantSearchResponse {
  string status = 1;
  int64 server_time = 2;
  repeated TenantSearchItem tenants = 3;
  string message = 4;
}

message TenantValidateRequest {
  string license_no = 1;
  string tenant_code = 2;
  string version = 3;
  string feature = 4;
  map<string, int64> usage = 5;
}

message TenantCurrentRequest {
  string license_no = 1;
  string tenant_code = 2;
}

message TenantResponse {
  string status = 1;
  int64 server_time = 2;
  bytes envelope_json = 3;
  string message = 4;
}

// ProjectConfigSyncRequest/Response 已随项目配置运行面下线，字段号以 reserved 锁定禁止复用。
message ProjectConfigSyncRequest {
  reserved 1, 2;
}

message ProjectConfigSyncResponse {
  reserved 1, 2, 3, 4;
}

message PlatformConfigSyncRequest {
  string license_no = 1;
  int32 project_id = 2;
  int32 since_version = 3;
}

message PlatformConfigSyncResponse {
  string status = 1;
  int64 server_time = 2;
  bytes envelope_json = 3;
  string message = 4;
}

// ConfigConsumptionItem - 单配置键消费计数。
message ConfigConsumptionItem {
  string key = 1;
  int32 count = 2;
}

// ConfigConsumptionReportRequest - 配置消费上报请求。
message ConfigConsumptionReportRequest {
  string license_no = 1;
  repeated ConfigConsumptionItem items = 2;
}

// ConfigConsumptionReportResponse - 配置消费上报响应。
message ConfigConsumptionReportResponse {
  string status = 1;
  int64 server_time = 2;
  string message = 3;
}

// EventSubscribeRequest - 事件订阅请求。
// since_event_id 为已消费水位（callback_events.id，0 = 从头）；
// timeout_ms 为长轮询 hold 时长（0 = 服务端默认 10000，硬上限 30000）。
message EventSubscribeRequest {
  string license_no = 1;
  int64 since_event_id = 2;
  int32 timeout_ms = 3;
}

// EventMessage - 单条订阅事件。
// envelope_json 必须是平台现场重签的 CallbackEnvelope JSON 原文，客户端基于其中 payload 原文验签。
message EventMessage {
  int64 event_id = 1;
  bytes envelope_json = 2;
}

// ConfigPushbackPushRequest - 配置回推请求。
// 快照语义天然幂等：同一快照重复推送，第二次起全部 unchanged；client_push_id 为批次级去重凭据。
message ConfigPushbackPushRequest {
  uint64 tenant_id = 1;               // 0 = 项目级；>0 = SaaS 租户级（平台校验租户归属项目）
  map<string, string> items = 2;      // 该作用域的全量配置快照
  string client_push_id = 3;          // 可选幂等批次号（SDK 缺省自动生成 UUIDv4）
}

// ConfigPushbackPushResponse - 配置回推批次结果。
message ConfigPushbackPushResponse {
  uint64 batch_id = 1;   // 平台批次号（pushback_batches.id）
  int32 created = 2;
  int32 updated = 3;
  int32 deleted = 4;
  int32 unchanged = 5;
  string pushed_at = 6;
}

// ConfigDefinitionGroup - 配置分组定义（客户端权威；parent 为父分组 name 路径，空 = 顶级）。
message ConfigDefinitionGroup {
  string name = 1;      // 分组名（单段，正则同配置键）
  string label = 2;
  string label_en = 3;
  string icon = 4;
  int32 sort = 5;
  string parent = 6;
}

// ConfigDefinitionItem - 配置项定义（客户端权威）。
message ConfigDefinitionItem {
  string key = 1;
  string label = 2;
  string type = 3;
  string group_path = 4;   // 所属分组 name 路径（斜杠分隔），空 = 未分组
  string options = 5;      // JSON 文本（选项数组原文），空串 = null
  string rules = 6;        // JSON 文本（RuleSet 原文），空串 = null
  string placeholder = 7;
  string remark = 8;
  string default_value = 9;
  bool sensitive = 10;
  int32 sort = 11;
}

// ConfigPushbackDefinitionsRequest - 配置定义反推请求（仅项目级，无 tenant_id）。
// 快照语义与值回推一致：幂等 = 快照幂等 + client_push_id 批次去重。
message ConfigPushbackDefinitionsRequest {
  repeated ConfigDefinitionGroup groups = 1;
  repeated ConfigDefinitionItem configs = 2;
  string client_push_id = 3;   // 可选幂等批次号（SDK 缺省自动生成 UUIDv4）
}

// ConfigPushbackDiffStats - 分组/配置项各自的 diff 计数。
message ConfigPushbackDiffStats {
  int32 created = 1;
  int32 updated = 2;
  int32 deleted = 3;
  int32 unchanged = 4;
}

// ConfigPushbackDefinitionsResponse - 配置定义反推批次结果。
message ConfigPushbackDefinitionsResponse {
  uint64 batch_id = 1;                 // 平台批次号（pushback_batches.id，kind=definitions）
  ConfigPushbackDiffStats groups = 2;
  ConfigPushbackDiffStats configs = 3;
  string pushed_at = 4;
}

// PlanRuntimeService - 项目套餐运行面（在售目录查询 + 套餐订单：购买/升级/续费下单、查单、取消、订单分页）。
// 与 activate/validate 同套实例签名防重放（activation-sign-v1，凭证锚定部署实例）；
// 金额在线上一律 double 元（服务端内部为万分，边界换算由服务端负责）；
// 失败语义与星链/API 商城同口径：业务拒绝经 errdetails.ErrorInfo.Reason 携带业务码
// （INVALID_ARGUMENT / NOT_FOUND / INVALID_STATE / CONFLICT 等），SDK 归一为与 HTTP 失败信封同形的 {code,msg,detail}。
service PlanRuntimeService {
  // PlanCatalog - 在售套餐目录（含当前生效付费套餐快照，无付费套餐时 current_plan 缺省）
  rpc PlanCatalog(PlanCatalogRequest) returns (PlanCatalogResponse);
  // PlanOrderCreate - 套餐下单（购买/升级/续费由服务端按当前套餐自动判定；
  // 幂等键 = request_id，同时经 metadata x-request-id 透传，重试返回既有订单）
  rpc PlanOrderCreate(PlanOrderCreateRequest) returns (PlanOrderCreateResponse);
  // PlanOrderQuery - 查单（按订单号，仅本实例订单；他实例订单模糊 NotFound）
  rpc PlanOrderQuery(PlanOrderQueryRequest) returns (PlanOrderResponse);
  // PlanOrderCancel - 取消订单（仅 pending；非 pending 返回 FailedPrecondition/INVALID_STATE）
  rpc PlanOrderCancel(PlanOrderCancelRequest) returns (PlanOrderResponse);
  // PlanOrderRows - 本实例订单分页（create_at 倒序）
  rpc PlanOrderRows(PlanOrderRowsRequest) returns (PlanOrderRowsResponse);
}

// PlanCatalogRequest - 在售套餐目录请求（凭证锚定许可证与实例，无额外入参）
message PlanCatalogRequest {
}

// PlanCatalogOption - 套餐计费选项
message PlanCatalogOption {
  string billing = 1;       // 计费周期：monthly / yearly / buyout
  double price = 2;         // 标价（元）
  double sale_price = 3;    // 货架展示价（元）：该实例视角下创始价/折扣互斥后的生效价，不含升级抵扣；下单金额以服务端结算为准
  string discount_tag = 4;  // 折扣/创始标签（如 "8折·试用期内"、"创始价"，无折扣为空串）
  int32 founder_left = 5;   // 创始价剩余名额（-1 = 非创始价）
  double credit_amount = 6; // 升级抵扣预览（元，0 = 无）：升级视角下旧套餐剩余价值的预估抵扣，随剩余期限逐日变化，结算以 PlanOrderCreate 为准
}

// PlanCatalogItem - 在售套餐目录项
message PlanCatalogItem {
  string plan_code = 1;
  string plan_name = 2;
  int32 grade = 3;                // 档位权重（0-1000，升降级判定依据）
  string badge = 4;               // 营销角标
  string summary = 5;             // 一句话卖点
  bytes entitlements_json = 6;    // 权益表 JSON 原文（map：模块编码 → bool/数值），原样透传不重序列化
  repeated PlanCatalogOption options = 7;
}

// PlanCurrentSnapshot - 当前生效付费套餐快照
message PlanCurrentSnapshot {
  string plan_code = 1;
  string plan_name = 2;
  string billing = 3;
  string valid_until = 4;  // RFC3339，与许可证载荷期限字段同格式
}

// PlanCatalogResponse - 在售套餐目录响应
message PlanCatalogResponse {
  repeated PlanCatalogItem plans = 1;
  PlanCurrentSnapshot current_plan = 2;  // 无付费套餐时为 null
}

// PlanOrderCreateRequest - 套餐下单请求
message PlanOrderCreateRequest {
  string plan_code = 1;
  string billing = 2;     // 计费周期：monthly / yearly / buyout
  string request_id = 3;  // 幂等键（SDK 缺省自动生成 req_ 前缀；服务端按实例+request_id 去重）
}

// PlanOrderCreateResponse - 套餐下单回执
message PlanOrderCreateResponse {
  string order_no = 1;
  double amount = 2;      // 应付金额（元）
  string pay_url = 3;     // inis-pay 收银台链接
  int64 expired_at = 4;   // 收银台过期时间（毫秒）
}

// PlanOrderQueryRequest - 查单请求
message PlanOrderQueryRequest {
  string order_no = 1;
}

// PlanOrderCancelRequest - 取消订单请求（幂等键取 order_no，经 metadata x-request-id 透传）
message PlanOrderCancelRequest {
  string order_no = 1;
}

// PlanOrderItem - 套餐订单条目（query/cancel/rows 共用）
message PlanOrderItem {
  string order_no = 1;
  string order_type = 2;  // purchase / upgrade / renew
  string plan_code = 3;
  string plan_name = 4;
  string billing = 5;
  double amount = 6;      // 金额（元）
  string status = 7;      // pending / paid / cancelled / closed
  string pay_url = 8;     // 收银台链接（仅 pending 有值）
  int64 paid_at = 9;      // 支付时间（毫秒，0 = 未支付）
  int64 create_at = 10;   // 下单时间（毫秒）
}

// PlanOrderResponse - 单订单响应（query/cancel 共用）
message PlanOrderResponse {
  PlanOrderItem order = 1;
}

// PlanOrderRowsRequest - 订单分页请求
message PlanOrderRowsRequest {
  int32 page = 1;   // 页码（1 起）
  int32 limit = 2;  // 每页条数（0 = 服务端默认）
}

// PlanOrderRowsResponse - 订单分页响应
message PlanOrderRowsResponse {
  repeated PlanOrderItem records = 1;
  int64 count = 2;
  int32 page = 3;
}

// CommandRuntimeService - 实例指令运行面（平台远程操作实例：实例长轮询领取指令 + 执行后回执）。
// 通道模型与事件订阅一致：实例主动连平台（穿透 NAT/防火墙），平台不反向直连实例；
// 与 activate/validate 同套实例签名防重放（activation-sign-v1，凭证锚定部署实例）。
service CommandRuntimeService {
  // Pull - 长轮询领取待执行指令（hold 语义与 EventSubscribe 一致：0=立即返回，默认 10s，硬上限 30s）；
  // 每次调用同时承担心跳（平台回写实例 last_seen_at，是在线状态的判定依据）。
  rpc Pull(CommandPullRequest) returns (CommandPullResponse);
  // Report - 指令执行回执（幂等：command_no 终态先入先赢，重复/迟到回执直接返回成功）。
  rpc Report(CommandReportRequest) returns (CommandReportResponse);
}

// CommandPullRequest - 指令领取请求。
message CommandPullRequest {
  string license_no = 1;
  // timeout_ms - 长轮询 hold 时长（0 = 服务端默认 10000，硬上限 30000）
  int32 timeout_ms = 2;
}

// CommandTask - 平台下发的一条远程指令。
message CommandTask {
  string command_no = 1;   // 指令编号（幂等键，同时是回执锚点）
  string action = 2;       // 指令动作白名单：runtime_info / license_refresh / config_refresh / update_check
  string params_json = 3;  // 动作参数 JSON 原文（无参数为空串）
  int64 issued_at = 4;     // 平台下发时间（毫秒）
}

// CommandPullResponse - 指令领取响应。
message CommandPullResponse {
  string status = 1;  // 许可证运行面状态码（与 RuntimeResponse.status 同口径；非放行态 commands 为空）
  int64 server_time = 2;
  repeated CommandTask commands = 3;
  string message = 4;
}

// CommandReportRequest - 指令执行回执请求。
message CommandReportRequest {
  string license_no = 1;
  string command_no = 2;
  string result = 3;        // 执行结果：success / failed
  string output_json = 4;   // 执行输出 JSON 原文（失败时为 {"message":"..."}；无输出为空串）
  int64 client_time = 5;
}

// CommandReportResponse - 指令执行回执响应。
message CommandReportResponse {
  string status = 1;
  int64 server_time = 2;
  string message = 3;
}
