version: 2
contract: licenhub.licence.v1
defaults:
  transport_fallback: false
  envelope: raw_json_bytes
  keyset: bootstrap_signed_raw_json
# 许可证运行面/管理面协议矩阵（强制维护）。运行面行列序固定 11 列（末列可省略），
# 由同目录 protocol_matrix_test.go 校验 RPC 覆盖与 SDK 传输绑定：
#   0 SDK 方法  1 HTTP 方法  2 HTTP 路径  3 gRPC full method
#   4 认证（public 匿名 / activation-sign-v1 = 许可证凭证 + Ed25519 请求签名）
#   5 权限码（运行面身份由许可证凭证推导，不进 IAM 权限码体系，留空）
#   6 数据域  7 操作（read / write）  8 风险（normal / high / critical）
#   9 幂等（true 可重放 / false 非幂等）
#   10 附加字段（可选；该行特有的请求/响应字段，如 keyset 恒为响应字段、
#      customer 为客户视图响应字段 customer{maskAccount,boundAt}——字段口径以 licen-hub
#      docs/md/license-core/许可证运行面接口契约.md 为准，改行前先对齐契约）
runtime:
  # keyset = 响应附带 bootstrap 根签名的项目工作公钥集合；HTTP 字段 keyset，gRPC 字段 keyset_json bytes。
  - [Client.Activate, POST, /api/v1/licenses/activate, LicenseRuntimeService/Activate, public, "", license, write, critical, false, "deviceName,keyset"]
  # activationCode = 激活码入座；migrationCode 已下线，仅为旧请求识别返回 MIGRATION_REMOVED，SDK 不再提供公开入口。
  # 激活码换证（Client.ActivateByCode）携带 currentLicenseNo 时请求带 activation-sign-v1 签名，
  # 成功返回目标许可证与 customer 视图；付费证冲突返回 ACTIVATION_CONFLICT + conflict 对比载荷（不消费码）。
  - [Client.ProvisionByPlan, POST, /api/v1/licenses/provision, LicenseRuntimeService/ProvisionByPlan, public, "", license, write, normal, false, "keyset,customer,conflict"]
  # 激活码换证入座（已激活实例专用；与 ProvisionByPlan 同端点，activationCode+currentLicenseNo 分支，
  # 必须 activation-sign-v1 签名）；冲突返回 ACTIVATION_CONFLICT 不消费码，confirmReplace=true 重发才换证。
  - [Client.ActivateByCode, POST, /api/v1/licenses/provision, LicenseRuntimeService/ProvisionByPlan, activation-sign-v1, "", license, write, critical, false, "keyset,customer,conflict"]
  # 授权预注册：固定许可证、回跳地址和 state，门户只按 requestNo 确认，禁止开放重定向；
  # 已绑定返回 CUSTOMER_BOUND + customer，不创建请求，供接入方自动同步脱敏归属。
  - [Client.CustomerBindPrepare, POST, /api/v1/licenses/customer-bind-prepare, LicenseRuntimeService/CustomerBindPrepare, activation-sign-v1, "", license, write, critical, false, "requestNo,expiresAt,customer"]
  # 客户账号绑定：门户授权确认页签发一次性票据，仅关联客户归属，不改变席位或套餐。
  - [Client.CustomerBind, POST, /api/v1/licenses/customer-bind, LicenseRuntimeService/CustomerBind, activation-sign-v1, "", license, write, critical, false, customer]
  # 解绑授权账号：TOTP 验证后释放席位并回退基础免费套餐，历史订单仅作凭证。
  - [Client.CustomerUnbind, POST, /api/v1/licenses/customer-unbind, LicenseRuntimeService/CustomerUnbind, activation-sign-v1, "", license, write, critical, false, ""]
  - [Client.Validate, POST, /api/v1/licenses/validate, LicenseRuntimeService/Validate, activation-sign-v1, "", license, write, normal, true, keyset]
  - [Client.Current, GET, /api/v1/licenses/current, LicenseRuntimeService/Current, activation-sign-v1, "", license, read, normal, true, keyset]
  - [Client.CheckUpdate, POST, /api/v1/updates/check, UpdateRuntimeService/Check, activation-sign-v1, "", update, read, normal, true, keyset]
  - [Client.ReportUpdate, POST, /api/v1/updates/report, UpdateRuntimeService/Report, activation-sign-v1, "", update, write, normal, true]
  - [Client.AppendUpdateLogs, POST, /api/v1/updates/logs, UpdateRuntimeService/AppendLogs, activation-sign-v1, "", update, write, normal, true]
  - [Client.SyncTenants, POST, /api/v1/saas/tenants/sync, SaasRuntimeService/Sync, activation-sign-v1, "", saas_tenant, read, normal, true]
  - [Client.TenantSearch, POST, /api/v1/saas/tenants/search, SaasRuntimeService/Search, activation-sign-v1, "", saas_tenant, read, normal, true]
  - [Client.ValidateTenant, POST, /api/v1/saas/tenants/validate, SaasRuntimeService/Validate, activation-sign-v1, "", saas_tenant, write, normal, true]
  - [Client.CurrentTenant, GET, /api/v1/saas/tenants/current, SaasRuntimeService/Current, activation-sign-v1, "", saas_tenant, read, normal, true]
  - [Client.PlatformConfigSync, POST, /api/v1/platform/configs/sync, PlatformConfigRuntimeService/Sync, activation-sign-v1, "", platform_config, read, normal, true]
  - [Client.PlatformConfigConsume, POST, /api/v1/platform/configs/consume, PlatformConfigRuntimeService/ReportConfigConsumption, activation-sign-v1, "", platform_config, write, normal, true]
  - [Client.Subscribe, POST, /api/v1/events/subscribe, EventRuntimeService/Subscribe, activation-sign-v1, "", callback_event, read, normal, true]
  # 配置回推（客户端 → 平台，客户端权威全量快照）：tenant_id=0 项目级 / >0 租户级；
  # 幂等 = 快照幂等 + client_push_id 批次去重。
  - [Client.PushConfig, POST, /api/v1/pushback/configs, ConfigPushbackRuntimeService/Push, activation-sign-v1, "", pushback_config, write, normal, true]
  - [Client.PushTenantConfig, POST, /api/v1/pushback/configs, ConfigPushbackRuntimeService/Push, activation-sign-v1, "", pushback_config, write, normal, true]
  # 配置定义反推（仅项目级，需项目开启定义反推模式，403 = 未开启）：groups/configs 分别 diff 计数；
  # 幂等 = 快照幂等 + client_push_id 批次去重。
  - [Client.PushConfigDefinitions, POST, /api/v1/pushback/config-definitions, ConfigPushbackRuntimeService/PushDefinitions, activation-sign-v1, "", pushback_config, write, normal, true]
  # 项目套餐运行面（在售目录 + 套餐订单）：licen-hub 为收款商户（inis-pay 收银台），信封形态
  # {code,msg,data} 与星链/API 商城同口径；下单幂等键 = requestId（请求体字段与 X-Request-Id 头
  # 双通道同值，服务端防呆不一致即 INVALID_ARGUMENT），取消幂等键 = 订单号。
  - [Client.PlansCatalog, GET, /api/v1/plans/catalog, PlanRuntimeService/PlanCatalog, activation-sign-v1, "", license_plan, read, normal, true]
  - [Client.PlanOrderCreate, POST, /api/v1/plan-orders/create, PlanRuntimeService/PlanOrderCreate, activation-sign-v1, "", license_plan, write, normal, true]
  - [Client.PlanOrderQuery, POST, /api/v1/plan-orders/query, PlanRuntimeService/PlanOrderQuery, activation-sign-v1, "", license_plan, read, normal, true]
  - [Client.PlanOrderCancel, POST, /api/v1/plan-orders/cancel, PlanRuntimeService/PlanOrderCancel, activation-sign-v1, "", license_plan, write, normal, true]
  - [Client.PlanOrderRows, GET, /api/v1/plan-orders/rows, PlanRuntimeService/PlanOrderRows, activation-sign-v1, "", license_plan, read, normal, true]
  # 实例指令运行面（平台远程操作实例：实例长轮询领取 + 执行回执，通道模型与事件订阅一致——实例
  # 主动连平台，平台不反向直连）：Pull 兼心跳（平台回写实例 last_seen_at）；指令动作白名单
  # runtime_info / license_refresh / config_refresh / update_check；回执幂等 = command_no 终态先入先赢。
  - [Client.PullCommands, POST, /api/v1/commands/pull, CommandRuntimeService/Pull, activation-sign-v1, "", instance_command, read, normal, true]
  - [Client.ReportCommand, POST, /api/v1/commands/report, CommandRuntimeService/Report, activation-sign-v1, "", instance_command, write, normal, true]
