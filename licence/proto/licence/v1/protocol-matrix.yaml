    - [CreateVersion, POST, /api/project-versions/create, permission, project.version.create, normal]
    - [UpdateVersion, PUT, /api/project-versions/update, permission, project.version.update, normal]
    - [ReleaseVersion, POST, /api/project-versions/release, permission, project.version.release, normal]
    - [ArchiveVersion, PUT, /api/project-versions/archive, permission, project.version.archive, normal]
    - [RemoveVersions, DELETE, /api/project-versions/remove, permission, project.version.delete, normal]
    - [DeleteVersions, DELETE, /api/project-versions/delete, permission, project.version.delete, normal]
    - [RestoreVersions, PUT, /api/project-versions/restore, permission, project.version.update, normal]
  ProjectModuleAdminService:
    - [RowsProjectModules, GET, /api/project-modules/rows, permission, project.module.read, normal]
    - [FindProjectModules, GET, /api/project-modules/find, permission, project.module.read, normal]
    - [GetProjectModule, GET, /api/project-modules/take, permission, project.module.read, normal]
    - [CreateProjectModule, POST, /api/project-modules/create, permission, project.module.create, normal]
    - [UpdateProjectModule, PUT, /api/project-modules/update, permission, project.module.update, normal]
    - [SortProjectModules, PUT, /api/project-modules/sort, permission, project.module.update, normal]
    - [RemoveProjectModules, DELETE, /api/project-modules/remove, permission, project.module.delete, normal]
    - [DeleteProjectModules, DELETE, /api/project-modules/delete, permission, project.module.delete, normal]
    - [RestoreProjectModules, PUT, /api/project-modules/restore, permission, project.module.update, normal]
  SaasMenuAdminService:
    - [FindSaasMenus, GET, /api/saas-menus/find, permission, saas.menu.read, normal]
    - [GetSaasMenu, GET, /api/saas-menus/take, permission, saas.menu.read, normal]
