version: 1
contract: licenhub.licence.v1
defaults:
  transport_fallback: false
  envelope: raw_json_bytes
runtime:
  - [Client.Activate, POST, /api/v1/licenses/activate, LicenseRuntimeService/Activate, public, "", license, write, critical, false]
  - [Client.Validate, POST, /api/v1/licenses/validate, LicenseRuntimeService/Validate, activation-sign-v1, "", license, write, normal, true]
  - [Client.Current, GET, /api/v1/licenses/current, LicenseRuntimeService/Current, activation-sign-v1, "", license, read, normal, true]
  - [Client.CheckUpdate, POST, /api/v1/updates/check, UpdateRuntimeService/Check, activation-sign-v1, "", update, read, normal, true]
  - [Client.ReportUpdate, POST, /api/v1/updates/report, UpdateRuntimeService/Report, activation-sign-v1, "", update, write, normal, true]
  - [Client.AppendUpdateLogs, POST, /api/v1/updates/logs, UpdateRuntimeService/AppendLogs, activation-sign-v1, "", update, write, normal, true]
  - [Client.SyncTenants, POST, /api/v1/saas/tenants/sync, SaasRuntimeService/Sync, activation-sign-v1, "", saas_tenant, read, normal, true]
  - [Client.ValidateTenant, POST, /api/v1/saas/tenants/validate, SaasRuntimeService/Validate, activation-sign-v1, "", saas_tenant, write, normal, true]
  - [Client.CurrentTenant, GET, /api/v1/saas/tenants/current, SaasRuntimeService/Current, activation-sign-v1, "", saas_tenant, read, normal, true]
  - [Client.SyncConfigs, POST, /api/v1/projects/configs/sync, ProjectConfigRuntimeService/Sync, activation-sign-v1, "", project, read, normal, true]
  - [Client.PlatformConfigSync, POST, /api/v1/platform/configs/sync, PlatformConfigRuntimeService/Sync, activation-sign-v1, "", platform_config, read, normal, true]
  - [Client.Subscribe, POST, /api/v1/events/subscribe, EventRuntimeService/Subscribe, activation-sign-v1, "", callback_event, read, normal, true]
admin:
  AdminAuthService:
    - [SignIn, POST, /api/comm/sign-in, public, "", normal]
    - [SignOut, DELETE, /api/comm/sign-out, authenticated, "", normal]
    - [CheckToken, POST, /api/comm/check-token, authenticated, "", normal]
  QualificationAdminService:
    - [ApplyQualification, POST, /api/qualification/apply, permission, qualification.apply, normal]
    - [GetCurrentQualification, GET, /api/qualification/current, permission, qualification.read, normal]
    - [FindMyQualifications, GET, /api/qualification/mine, permission, qualification.read, normal]
    - [RowsQualifications, GET, /api/qualification/rows, permission, qualification.review, normal]
    - [FindQualifications, GET, /api/qualification/find, permission, qualification.review, normal]
    - [GetQualification, GET, /api/qualification/take, permission, qualification.review, normal]
    - [ReviewQualification, POST, /api/qualification/review, permission, qualification.review, high]
    - [RevokeQualification, POST, /api/qualification/revoke, permission, qualification.review, high]
  ProjectAdminService:
    - [RowsProjects, GET, /api/projects/rows, permission, project.read, normal]
    - [FindProjects, GET, /api/projects/find, permission, project.read, normal]
    - [GetProject, GET, /api/projects/take, permission, project.read, normal]
    - [CreateProject, POST, /api/projects/create, permission, project.create, normal]
    - [UpdateProject, PUT, /api/projects/update, permission, project.update, normal]
    - [RemoveProjects, DELETE, /api/projects/remove, permission, project.delete, normal]
    - [DeleteProjects, DELETE, /api/projects/delete, permission, project.delete, normal]
    - [RestoreProjects, PUT, /api/projects/restore, permission, project.update, normal]
  InstanceAdminService:
    - [RowsInstances, GET, /api/instances/rows, permission, project.instance.read, normal]
    - [FindInstances, GET, /api/instances/find, permission, project.instance.read, normal]
    - [GetInstance, GET, /api/instances/take, permission, project.instance.read, normal]
    - [CreateInstance, POST, /api/instances/create, permission, project.instance.create, normal]
    - [UpdateInstance, PUT, /api/instances/update, permission, project.instance.update, normal]
    - [RemoveInstances, DELETE, /api/instances/remove, permission, project.instance.delete, normal]
    - [DeleteInstances, DELETE, /api/instances/delete, permission, project.instance.delete, normal]
    - [RestoreInstances, PUT, /api/instances/restore, permission, project.instance.update, normal]
  LicenseAdminService:
    - [RowsLicenses, GET, /api/licenses/rows, permission, license.read, normal]
    - [FindLicenses, GET, /api/licenses/find, permission, license.read, normal]
    - [GetLicense, GET, /api/licenses/take, permission, license.read, normal]
    - [GetLicensePayload, GET, /api/licenses/take-payload, permission, license.read, normal]
    - [GetLicensePublicKey, GET, /api/licenses/public-key, authenticated, "", normal]
    - [ApplyLicense, POST, /api/licenses/apply, permission, license.apply, normal]
    - [CancelLicenseApplication, POST, /api/licenses/cancel, permission, license.apply, normal]
    - [RowsLicenseApplications, GET, /api/licenses/applications/rows, permission, license.read, normal]
    - [GetLicenseApplication, GET, /api/licenses/applications/take, permission, license.read, normal]
    - [ReviewLicenseApplication, POST, /api/licenses/review, permission, license.review, high]
    - [RenewLicense, POST, /api/licenses/renew, permission, license.renew, normal]
    - [SuspendLicense, POST, /api/licenses/suspend, permission, license.suspend, high]
    - [RevokeLicense, POST, /api/licenses/revoke, permission, license.revoke, critical]
    - [ReissueLicense, POST, /api/licenses/reissue, permission, license.review, high]
    - [RowsLicenseHistory, GET, /api/licenses/history/rows, permission, license.read, normal]
    - [GetLicenseHistory, GET, /api/licenses/history/take, permission, license.read, normal]
    - [RowsActivations, GET, /api/licenses/activations/rows, permission, license.read, normal]
    - [GetActivation, GET, /api/licenses/activations/take, permission, license.read, normal]
  SigningKeyAdminService:
    - [GetSigningPublicKey, GET, /api/signing-keys/public, authenticated, "", normal]
    - [RotateSigningKey, POST, /api/signing-keys/rotate, permission, system.signing-key.rotate, critical]
  ArtifactAdminService:
    - [RowsArtifacts, GET, /api/project-artifacts/rows, permission, project.artifact.read, normal]
    - [FindArtifacts, GET, /api/project-artifacts/find, permission, project.artifact.read, normal]
    - [GetArtifact, GET, /api/project-artifacts/take, permission, project.artifact.read, normal]
    - [UploadArtifact, POST, /api/project-artifacts/upload, permission, project.artifact.upload, normal]
    - [UpdateArtifact, PUT, /api/project-artifacts/update, permission, project.artifact.update, normal]
    - [VerifyArtifact, POST, /api/project-artifacts/verify, authenticated, "", normal]
    - [VerifyArtifactFile, POST, /api/project-artifacts/verify, authenticated, "", normal]
    - [RemoveArtifacts, DELETE, /api/project-artifacts/remove, permission, project.artifact.delete, normal]
    - [DeleteArtifacts, DELETE, /api/project-artifacts/delete, permission, project.artifact.delete, normal]
  VersionAdminService:
    - [RowsVersions, GET, /api/project-versions/rows, permission, project.version.read, normal]
    - [FindVersions, GET, /api/project-versions/find, permission, project.version.read, normal]
